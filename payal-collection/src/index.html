<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payal Collection | Premium Ladies Wear & Kurties</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Manifest Link for PWA Installation -->
  <link rel="manifest" href="/manifest.json">
  <style>
    /* Custom styles for size button active states */
    .size-btn.selected {
      background-color: #db2777 !important;
      color: white !important;
      border-color: #db2777 !important;
    }
  </style>
</head>
<body class="bg-pink-50/30 text-gray-800 font-sans">

  <!-- Header / Boutique Branding -->
  <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-4 border-b border-pink-100">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <h1 class="text-3xl font-extrabold tracking-wide text-pink-600 drop-shadow-sm">
        🌸 PAYAL COLLECTION
      </h1>
      <p class="text-sm sm:text-base text-gray-500 italic font-medium">Exquisite Kurties & Ladies Wear</p>
    </div>
  </header>

  <!-- Dynamic Filter Controls -->
  <section class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-white p-4 rounded-2xl shadow-xs border border-pink-100/50 flex flex-wrap gap-4 items-center">
      <span class="font-semibold text-gray-600 text-sm">Filter By:</span>
      
      <!-- Fabric Filter -->
      <select id="fabricFilter" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-pink-500">
        <option value="all">All Fabrics</option>
        <option value="Cotton">Cotton</option>
        <option value="Rayon">Rayon</option>
        <option value="Georgette">Georgette</option>
      </select>

      <!-- Style Type Filter -->
      <select id="styleFilter" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-pink-500">
        <option value="all">All Styles</option>
        <option value="Straight Cut">Straight Cut</option>
        <option value="Anarkali">Anarkali</option>
        <option value="Co-ord Set">Co-ord Set</option>
      </select>
    </div>
  </section>

  <!-- Main Product Display Grid -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Dynamic Product Cards will be injected here via app.js -->
      <div class="col-span-full text-center py-12 text-gray-400">
        Loading latest collections...
      </div>
    </div>
  </main>

  <!-- PWA Connection Script & App Logic -->
  <script type="module" src="app.js"></script>
</body>
</html>
